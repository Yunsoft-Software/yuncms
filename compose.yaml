name: yuncms

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: yuncms
      MYSQL_USER: yuncms
      MYSQL_PASSWORD: ${YUNCMS_DB_PASSWORD:?Set YUNCMS_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${YUNCMS_DB_ROOT_PASSWORD:?Set YUNCMS_DB_ROOT_PASSWORD in .env}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  yuncms:
    image: ${YUNCMS_IMAGE:-yunsoftofficial/yuncms:0.1.21}
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      HOST: 0.0.0.0
      PORT: 3008
      LOG_LEVEL: ${YUNCMS_LOG_LEVEL:-info}
      STUDIO_ORIGIN: ${YUNCMS_PUBLIC_URL:-http://localhost:3008}
      AUTH_PUBLIC_URL: ${YUNCMS_PUBLIC_URL:-http://localhost:3008}
      TRUST_PROXY_HOPS: ${YUNCMS_TRUST_PROXY_HOPS:-0}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: yuncms
      DB_USER: yuncms
      DB_PASSWORD: ${YUNCMS_DB_PASSWORD:?Set YUNCMS_DB_PASSWORD in .env}
      DB_CONNECTION_LIMIT: ${YUNCMS_DB_CONNECTION_LIMIT:-10}
      DB_SSL: "false"
      FILES_LOCAL_ROOT: /data/uploads
    ports:
      - "${YUNCMS_PORT:-3008}:3008"
    volumes:
      - yuncms-data:/data
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s

volumes:
  mysql-data:
  yuncms-data:
